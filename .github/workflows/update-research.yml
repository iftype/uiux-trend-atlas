name: Refresh foreign UI UX research

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect official feeds
        run: npm run research:update
      - name: Validate generated data and site
        run: npm run check
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "uiux-trend-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/generated/foreign-updates.json public/data/foreign-updates.json research/13-foreign-tech-blogs/LATEST.md
          git commit -m "chore(data): refresh foreign UX feeds"
          git push
