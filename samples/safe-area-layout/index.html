<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe Area Layout Sample</title>
  <style>
    :root { --visual-height: 100dvh; font-family: system-ui, sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app {
      min-height: 100svh;
      height: var(--visual-height);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      overflow: hidden;
    }
    header, footer { padding: 16px; border-block: 1px solid currentColor; }
    main { overflow: auto; padding: 20px; }
    form { display: grid; gap: 10px; max-width: 480px; margin: auto; }
    input, button { min-height: 48px; padding: 0 14px; font: inherit; }
  </style>
</head>
<body>
  <div class="app">
    <header>WEBVIEW HEADER</header>
    <main>
      <form>
        <label for="message">메시지</label>
        <input id="message" autocomplete="off" placeholder="키보드를 열어 확인">
      </form>
    </main>
    <footer><button type="button">완료</button></footer>
  </div>
  <script>
    const viewport = window.visualViewport;
    const syncHeight = () => {
      const height = viewport?.height ?? window.innerHeight;
      document.documentElement.style.setProperty("--visual-height", `${height}px`);
    };
    viewport?.addEventListener("resize", syncHeight);
    viewport?.addEventListener("scroll", syncHeight);
    syncHeight();
  </script>
</body>
</html>
